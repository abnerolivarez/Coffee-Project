<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Place Your Order | Brew & Bean</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

    <!-- HEADER -->

    <header class="order-nav text-white py-3 shadow">

        <div class="container w-100" style="max-width: 900px;">

            <div class="d-flex justify-content-between align-items-center">
                
                <a href="index.html"
                    class="text-white text-decoration-none fw-bold fs-6">
                    <img src="image/logo.png" alt="" class="coffee-logo" style="width: 35px; ">
                    Brew & Bean
                </a>

                <a href="menu.html#menu-products"
                    class="btn btn-outline-light">
                    <i class="bi bi-arrow-left"></i>
                    Back
                </a>

            </div>

        </div>

    </header>


    <!-- ORDER SECTION -->

    <section class="py-5">

        <div class="container">

            <div class="text-center mb-5">

                <h1 class="fw-bold">
                    Customize Your Order
                </h1>

                <p class="text-secondary">
                    Choose your preferred size and quantity.
                </p>

            </div>


            <div class="row justify-content-center g-4">


                <!-- PRODUCT -->

                <div class="col-12 col-lg-6">

                    <div class="card border-0 shadow-sm rounded-4 h-100">

                        <div class="card-body p-4 text-center">

                            <img id="productImage"
                                src=""
                                alt=""
                                class="img-fluid rounded-circle mb-4"
                                style="width: 220px; height: 220px; object-fit: cover;">

                            <h2 id="productTitle"
                                class="fw-bold">
                                Product
                            </h2>

                            <p id="productDescription"
                                class="text-secondary">
                            </p>

                            <div id="optionSection" class="mt-4">

                                <h6 class="fw-bold">Select One</h6>

                                <div id= sizeOptions class="d-flex justify-content-center gap-2 flex-wrap">
                                    <!-- LOAD DESIGN HERE -->
                                </div>

                            </div>


                            <!-- QUANTITY -->

                            <div class="mt-4">

                                <h6 class="fw-bold">
                                    Quantity
                                </h6>

                                <div class="d-flex justify-content-center align-items-center gap-3">

                                    <button id="minusBtn"
                                        class="btn btn-dark rounded-circle">

                                        <i class="bi bi-dash"></i>

                                    </button>


                                    <span id="quantity"
                                        class="fs-4 fw-bold">
                                        1
                                    </span>


                                    <button id="plusBtn"
                                        class="btn btn-dark rounded-circle">

                                        <i class="bi bi-plus"></i>

                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ORDER SUMMARY -->

                <div class="col-12 col-lg-5">

                    <div class="card border-0 shadow-sm rounded-4">

                        <div class="card-body p-4">

                            <h4 class="fw-bold mb-4">
                                Order Summary
                            </h4>


                            <div class="d-flex justify-content-between mb-3">

                                <span>
                                    Product
                                </span>

                                <strong id="summaryProduct">
                                    - 
                                </strong>

                            </div>


                            <div class="d-flex justify-content-between mb-3">

                                <span class="optionLabel">
                                    Size
                                </span>

                                <strong id="summarySize">
                                    Small
                                </strong>

                            </div>


                            <div class="d-flex justify-content-between mb-3">

                                <span>
                                    Price
                                </span>

                                <strong id="summaryPrice" class="text-danger">
                                    ₱0
                                </strong>

                            </div>


                            <div class="d-flex justify-content-between mb-3">

                                <span>
                                    Quantity
                                </span>

                                <strong id="summaryQuantity">
                                    0
                                </strong>

                            </div>
                            <hr>

                            <div class="d-flex justify-content-between mb-3">

                                <span id="totalQuantityLabel">
                                    Total Quantity
                                </span>

                                <strong id="totalQuantity">
                                    0
                                </strong>

                            </div>


                            <hr>


                            <div class="d-flex justify-content-between align-items-center">

                                <span class="fw-bold fs-5">
                                    Total Price
                                </span>

                                <span id="totalPrice"
                                    class="fw-bold fs-4 text-danger">
                                    ₱0
                                </span>

                            </div>


                            <button id="placeOrderBtn"
                                class="btn btn-dark w-100 mt-4 py-3 fw-semibold">

                                <i class="bi bi-bag-check me-2"></i>
                                Place Order

                            </button>

                        </div>

                    </div>


                    <!-- SPECIAL INSTRUCTIONS -->

                    <div class="card border-0 shadow-sm rounded-4 mt-4">

                        <div class="card-body p-4">

                            <label for="instructions"
                                class="form-label fw-bold">

                                Special Instructions

                            </label>

                            <textarea id="instructions"
                                class="form-control"
                                rows="3"
                                placeholder="Example: Less sugar, extra ice..."></textarea>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- JAVASCRIPT -->

    <script src="product.js"></script>
    <script src="order.js"></script>

</body>

</html>
